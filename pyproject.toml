[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blumax-auth"
version = "0.2.1"
description = "Verify BluMax Core-issued JWTs. Verification only — never issuance."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "cryptography>=42",
    "fastapi>=0.115",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blumax_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blumax-auth"
version = "0.3.0"
description = "Verify BluMax Core-issued JWTs. Verification only — never issuance."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
# redis is only imported inside configure_session_revocation() — a service
# that never opts into that check need not install it. Services that do
# (via `pip install blumax-auth[session-revocation]`) get the same
# redis.asyncio client blumax-backend itself uses.
session-revocation = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "cryptography>=42",
    "fastapi>=0.115",
    "redis>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blumax_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
